<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nour Group ERP - نظام إدارة المبيعات والمخزون</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Html5-Qrcode Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between hidden md:flex">
            <div>
                <div class="p-5 text-2xl font-bold border-b border-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-boxes-stacked text-blue-500"></i>
                    <span>Nour Group</span>
                </div>
                <nav class="p-4 space-y-2">
                    <a href="#" onclick="switchTab('pos')" class="tab-btn flex items-center gap-3 p-3 rounded-lg bg-blue-600 text-white font-medium transition"><i class="fa-solid fa-cash-register"></i> نقطة البيع (POS)</a>
                    <a href="#" onclick="switchTab('inventory')" class="tab-btn flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 text-slate-300 transition"><i class="fa-solid fa-warehouse"></i> إدارة المخزون</a>
                </nav>
            </div>
            <div class="p-4 border-t border-slate-800 text-sm text-slate-400 text-center">
                جميع الحقوق محفوظة &copy; 2026
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow-sm p-4 flex justify-between items-center">
                <h1 id="page-title" class="text-xl font-bold text-slate-800">نقطة البيع المباشر (POS)</h1>
                <div class="flex items-center gap-3">
                    <span class="text-sm font-semibold bg-blue-50 text-blue-600 px-3 py-1.5 rounded-full">مدير النظام</span>
                </div>
            </header>

            <div class="p-6">
                <!-- POS Tab -->
                <div id="tab-pos" class="tab-content grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-4">
                        <div class="bg-white p-4 rounded-xl shadow-sm flex gap-2">
                            <input type="text" id="pos-search" placeholder="ابحث باسم المنتج أو الباركود..." class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <button onclick="openScanner()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition flex items-center gap-2">
                                <i class="fa-solid fa-camera"></i> مسح بالكاميرا
                            </button>
                        </div>

                        <!-- Scanner Modal Box (Hidden by default) -->
                        <div id="scanner-container" class="bg-white p-4 rounded-xl shadow-sm hidden border border-emerald-200">
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="font-bold text-emerald-700"><i class="fa-solid fa-barcode"></i> وجه الكاميرا نحو باركود المنتج</h3>
                                <button onclick="closeScanner()" class="text-red-500 hover:text-red-700 font-bold px-2">إغلاق <i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <div id="reader" class="w-full max-w-md mx-auto"></div>
                        </div>

                        <div class="bg-white p-4 rounded-xl shadow-sm">
                            <h3 class="font-bold mb-3 text-slate-700">المنتجات المتاحة</h3>
                            <div id="pos-products-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                <!-- سيتم تعبئتها تلقائياً عبر الجافاسكريبت -->
                            </div>
                        </div>
                    </div>

                    <!-- Cart Summary -->
                    <div class="bg-white p-4 rounded-xl shadow-sm flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold mb-3 text-slate-700 border-b pb-2">سلة المشتريات</h3>
                            <div id="cart-items" class="space-y-3 max-h-80 overflow-y-auto mb-4">
                                <p class="text-gray-400 text-center py-6">السلة فارغة حالياً</p>
                            </div>
                        </div>
                        <div class="border-t pt-4">
                            <div class="flex justify-between text-lg font-bold mb-4">
                                <span>الإجمالي:</span>
                                <span id="cart-total" class="text-blue-600">0.00 ج.م</span>
                            </div>
                            <button onclick="checkout()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">إتمام الدفع</button>
                        </div>
                    </div>
                </div>

                <!-- Inventory Tab -->
                <div id="tab-inventory" class="tab-content hidden space-y-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
                        <h3 class="font-bold text-lg text-slate-700">إدارة الأصناف والمخزون</h3>
                        <button onclick="addProductModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition"><i class="fa-solid fa-plus"></i> إضافة صنف جديد</button>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                        <table class="w-full text-right border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                                    <th class="p-3">اسم المنتج</th>
                                    <th class="p-3">الباركود</th>
                                    <th class="p-3">السعر</th>
                                    <th class="p-3">المخزون المتبقي</th>
                                    <th class="p-3">الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-table-body">
                                <!-- سيتم تعبئتها ديناميكياً -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // قاعدة بيانات مبدئية مخزنة محلياً
        let products = JSON.parse(localStorage.getItem('erp_products')) || [
            { id: 1, name: 'شاي العروسة 250جم', barcode: '6221112223331', price: 45, stock: 15 },
            { id: 2, name: 'سكر الأبيض 1كجم', barcode: '6224445556662', price: 35, stock: 8 },
            { id: 3, name: 'زيت عافية ذرة 800مل', barcode: '6227778889993', price: 95, stock: 4 }
        ];

        let cart = [];
        let html5QrCode = null;

        function saveProducts() {
            localStorage.setItem('erp_products', JSON.stringify(products));
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('hover:bg-slate-800', 'text-slate-300');
            });
            event.currentTarget.classList.add('bg-blue-600', 'text-white');
            event.currentTarget.classList.remove('hover:bg-slate-800', 'text-slate-300');

            if(tabId === 'inventory') renderInventory();
            if(tabId === 'pos') renderPOSProducts();
        }

        function renderPOSProducts() {
            const grid = document.getElementById('pos-products-grid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div onclick="addToCart(${p.id})" class="bg-gray-50 border border-gray-200 p-4 rounded-xl cursor-pointer hover:border-blue-500 hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <h4 class="font-bold text-slate-800">${p.name}</h4>
                            <p class="text-xs text-gray-500 mt-1">كود: ${p.barcode}</p>
                        </div>
                        <div class="mt-4 flex justify-between items-center">
                            <span class="text-blue-600 font-bold">${p.price} ج.م</span>
                            <span class="text-xs bg-gray-200 px-2 py-1 rounded">متبقي: ${p.stock}</span>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product || product.stock <= 0) {
                alert('عذراً، هذا المنتج نفد من المخزون!');
                return;
            }
            const cartItem = cart.find(item => item.id === productId);
            if (cartItem) {
                if (cartItem.qty < product.stock) {
                    cartItem.qty++;
                } else {
                    alert('الكمية المطلوبة تتجاوز المخزون المتاح.');
                }
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-6">السلة فارغة حالياً</p>`;
                document.getElementById('cart-total').innerText = '0.00 ج.م';
                return;
            }
            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border">
                        <div>
                            <h5 class="font-bold text-sm">${item.name}</h5>
                            <span class="text-xs text-gray-500">${item.price} ج.م × ${item.qty}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = total.toFixed(2) + ' ج.م';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function checkout() {
            if (cart.length === 0) return alert('السلة فارغة!');
            cart.forEach(cItem => {
                const p = products.find(prod => prod.id === cItem.id);
                if (p) p.stock -= cItem.qty;
            });
            saveProducts();
            cart = [];
            renderCart();
            renderPOSProducts();
            alert('تم إتمام عملية البيع بنجاح وتحديث المخزون!');
        }

        function renderInventory() {
            const tbody = document.getElementById('inventory-table-body');
            tbody.innerHTML = '';
            products.forEach(p => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50 text-sm">
                        <td class="p-3 font-semibold">${p.name}</td>
                        <td class="p-3 text-gray-600">${p.barcode}</td>
                        <td class="p-3">${p.price} ج.م</td>
                        <td class="p-3"><span class="px-2 py-1 rounded ${p.stock <= 5 ? 'bg-red-100 text-red-600 font-bold' : 'bg-green-100 text-green-600'}">${p.stock}</span></td>
                        <td class="p-3">
                            <button onclick="deleteProduct(${p.id})" class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i> حذف</button>
                        </td>
                    </tr>
                `;
            });
        }

        function addProductModal() {
            const name = prompt('أدخل اسم المنتج الجديد:');
            if (!name) return;
            const barcode = prompt('أدخل رقم الباركود (أو كود الصنف):');
            if (!barcode) return;
            const price = parseFloat(prompt('أدخل سعر البيع:'));
            const stock = parseInt(prompt('أدخل الكمية المتوفرة بالمخزون:'));

            if (isNaN(price) || isNaN(stock)) {
                alert('الرجاء إدخال أرقام صحيحة للسعر والكمية.');
                return;
            }

            products.push({ id: Date.now(), name, barcode, price, stock });
            saveProducts();
            renderInventory();
            renderPOSProducts();
            alert('تم إضافة المنتج بنجاح!');
        }

        function deleteProduct(id) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                products = products.filter(p => p.id !== id);
                saveProducts();
                renderInventory();
                renderPOSProducts();
            }
        }

        // إعدادات الكاميرا والمسح الضوئي للباركود
        function openScanner() {
            document.getElementById('scanner-container').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 150 } };
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                (decodedText, decodedResult) => {
                    // عند نجاح قراءة الباركود
                    findProductByBarcode(decodedText);
                    closeScanner();
                },
                (errorMessage) => {
                    // أخطاء القراءة المتكررة أثناء البحث تتجاهل طبيعياً
                }
            ).catch(err => {
                alert('تعذر فتح الكاميرا، تأكد من إعطاء الصلاحيات للمتصفح.');
                closeScanner();
            });
        }

        function closeScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scanner-container').classList.add('hidden');
                }).catch(err => {
                    document.getElementById('scanner-container').classList.add('hidden');
                });
            } else {
                document.getElementById('scanner-container').classList.add('hidden');
            }
        }

        function findProductByBarcode(code) {
            const product = products.find(p => p.barcode === code);
            if (product) {
                addToCart(product.id);
            } else {
                alert('الباركود (' + code + ') غير مسجل في النظام!');
            }
        }

        // التهيئة الأولية
        renderPOSProducts();
    </script>
</body>
</html>
