<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة نور جروب - الطلبات والمخزن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: right; }
        .order-card { background: #1e1e1e; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-right: 5px solid #ffc107; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <h2>📋 لوحة تحكم نور جروب (استقبال الطلبات)</h2>
    <div id="orders-container">جاري تحميل الطلبات الواردة...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2cAK8GHJ4Bf4qv3nSiYp5TEIjzMyVDA",
            authDomain: "nour-shop-69bbd.firebaseapp.com",
            projectId: "nour-shop-69bbd",
            storageBucket: "nour-shop-69bbd.firebasestorage.app",
            messagingSenderId: "709172061764",
            appId: "1:709172061764:web:6e25c544544abdaf0667fe11",
            measurementId: "G-69CFWNF3MP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchOrders() {
            const container = document.getElementById('orders-container');
            container.innerHTML = "";
            
            const querySnapshot = await getDocs(collection(db, "orders"));
            if (querySnapshot.empty) {
                container.innerHTML = "<p>لا توجد طلبات جديدة حتى الآن.</p>";
                return;
            }

            querySnapshot.forEach((orderDoc) => {
                let order = orderDoc.data();
                let orderId = orderDoc.id;

                let div = document.createElement('div');
                div.className = "order-card";
                div.innerHTML = `
                    <h3>فاتورة رقم: #${order.orderNumber}</h3>
                    <p><strong>العميل:</strong> ${order.customerName} - ${order.customerPhone}</p>
                    <p><strong>العنوان:</strong> ${order.customerAddress}</p>
                    <p><strong>المنتجات المطلوبة:</strong> ${order.items.map(i => `${i.name} (الكمية: ${i.qty})`).join('، ')}</p>
                    <p><strong>الإجمالي:</strong> ${order.total} جنيه</p>
                    <p><strong>الحالة:</strong> <span style="color: #ffc107;">${order.status}</span></p>
                    ${order.status.includes('تم التأكيد') ? '' : `<button onclick="confirmAndReduceStock('${orderId}')">تأكيد الطلب وخصم المخزن ✅</button>`}
                `;
                container.appendChild(div);
            });
        }

        // دالة تأكيد الطلب وخصم الكمية من مخزن المنتجات أوتوماتيك
        window.confirmAndReduceStock = async function(orderId) {
            try {
                const orderRef = doc(db, "orders", orderId);
                const orderSnap = await getDoc(orderRef);
                let orderData = orderSnap.data();

                // 1. خصم الكميات من جدول المنتجات في المخزن
                for (let item of orderData.items) {
                    const prodRef = doc(db, "products", item.id);
                    const prodSnap = await getDoc(prodRef);
                    if (prodSnap.exists()) {
                        let currentStock = prodSnap.data().stock;
                        let newStock = Math.max(0, currentStock - item.qty);
                        await updateDoc(prodRef, { stock: newStock });
                    }
                }

                // 2. تحديث حالة الفاتورة إلى "تم التأكيد"
                await updateDoc(orderRef, { status: "تم التأكيد وإرسال المندوب ✅" });
                
                alert("تم تأكيد الطلب بنجاح وتم خصم الكميات من المخزن أوتوماتيك!");
                fetchOrders();
            } catch (e) {
                alert("حدث خطأ: " + e.message);
            }
        }

        fetchOrders();
    </script>
</body>
</html>
